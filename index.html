
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bird Blaze | Playtech Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071629;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:12px;background:#091c35}
h1{margin:0;color:#ffb52e;font-size:28px}
header p{margin:5px;color:#c6ddf7;font-size:12px;letter-spacing:2px}
#stats{display:flex;justify-content:center;gap:30px;padding:10px;background:#102b49}
.stat{font-size:12px;color:#bcd9f7}
.stat b{display:block;font-size:19px;color:white;margin-top:4px}
#game{display:block;width:100%;max-width:900px;height:min(62vh,560px);margin:auto;background:#64c8ff;touch-action:manipulation}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px}
button{padding:12px 17px;border:0;border-radius:10px;background:#ffb52e;color:#17243a;font-size:15px;font-weight:bold;cursor:pointer}
.secondary{background:#204669;color:white}
#message{max-width:500px;margin:10px auto;padding:16px;background:#102b49;border-radius:14px}
.hidden{display:none!important}
footer{padding:18px;color:#d5e9ff;font-size:13px;letter-spacing:2px}
</style>
</head>
<body>
<header>
<h1>🐦 BIRD BLAZE</h1>
<p>FLY · DODGE · SURVIVE</p>
</header>

<div id="stats">
<div class="stat">SCORE<b id="score">0</b></div>
<div class="stat">BEST<b id="best">0</b></div>
</div>

<canvas id="game" width="800" height="520"></canvas>

<div class="controls">
<button id="startBtn">▶ START GAME</button>
<button id="flyBtn">⬆ FLY</button>
<button id="pauseBtn" class="secondary">Ⅱ PAUSE</button>
<button id="restartBtn" class="secondary">↻ RESTART</button>
</div>

<div id="message">
<h2 id="messageTitle">BIRD BLAZE</h2>
<p id="messageText">Fly through the clouds and avoid obstacles.</p>
<button id="playBtn">START FLYING</button>
</div>

<footer>PLAYTECH STUDIO | BIRD BLAZE</footer>

<script>
"use strict";
(() => {
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);
const W = canvas.width, H = canvas.height;

let best = 0;
try { best = Number(localStorage.getItem("birdBlazeBest")) || 0; } catch(e) {}

let score = 0;
let running = false;
let paused = false;
let gameOver = false;
let lastTime = 0;
let obstacleTimer = 0;
let coinTimer = 0;
let world = 0;
let obstacles = [];
let coins = [];

const bird = {x:170,y:225};
const birdImage = new Image();
birdImage.src = "bird-blaze-screen.png";
let imageReady = false;
birdImage.onload = () => { imageReady = true; };
birdImage.onerror = () => { imageReady = false; };

function updateUI() {
  $("score").textContent = score;
  $("best").textContent = best;
}

function message(title, text, button) {
  $("messageTitle").textContent = title;
  $("messageText").textContent = text;
  $("playBtn").textContent = button;
  $("message").classList.remove("hidden");
}

function startGame() {
  score = 0;
  obstacles = [];
  coins = [];
  obstacleTimer = 0;
  coinTimer = 0;
  bird.y = H * 0.43;
  running = true;
  paused = false;
  gameOver = false;
  $("message").classList.add("hidden");
  $("pauseBtn").textContent = "Ⅱ PAUSE";
  updateUI();
  lastTime = performance.now();
}

function fly() {
  if (!running && !paused) {
    if (gameOver) startGame();
    else startGame();
  }
  if (!paused) {
    // Gentle upward movement, without gravity or falling.
    bird.y = Math.max(65, bird.y - 13);
  }
}

function endGame() {
  running = false;
  paused = false;
  gameOver = true;
  best = Math.max(best, score);
  try { localStorage.setItem("birdBlazeBest", String(best)); } catch(e) {}
  updateUI();
  message("GAME OVER", "Score: " + score + ". Avoid the obstacles and try again!", "PLAY AGAIN");
}

function addObstacle() {
  const gap = 175;
  const top = 45 + Math.random() * (H - gap - 140);
  obstacles.push({x:W + 30, top, gap, passed:false});
}

function addCoins() {
  const y = 70 + Math.random() * 150;
  for (let i=0;i<4;i++) {
    coins.push({x:W + 25 + i*38, y:y - Math.sin(i)*8, taken:false});
  }
}

function update(dt) {
  if (!running || paused) return;

  // Bird stays airborne automatically. No gravity is applied.
  bird.y = H * 0.43 + Math.sin(performance.now()/430) * 7;

  const speed = Math.min(340, 230 + score * 0.35);
  world += speed * dt;
  score += Math.floor(dt * 10);

  obstacleTimer += dt;
  coinTimer += dt;

  if (obstacleTimer > 1.55) {
    obstacleTimer = 0;
    addObstacle();
  }
  if (coinTimer > 1.35) {
    coinTimer = 0;
    addCoins();
  }

  for (const o of obstacles) {
    o.x -= speed * dt;

    const birdL = bird.x - 24, birdR = bird.x + 24;
    const birdT = bird.y - 18, birdB = bird.y + 18;

    if (birdR > o.x && birdL < o.x + 60 &&
        (birdT < o.top || birdB > o.top + o.gap)) {
      endGame();
      return;
    }

    if (!o.passed && o.x + 60 < bird.x) {
      o.passed = true;
      score += 5;
    }
  }

  obstacles = obstacles.filter(o => o.x > -80);

  for (const c of coins) {
    c.x -= speed * dt;
    if (!c.taken && Math.hypot(c.x-bird.x,c.y-bird.y)<34) {
      c.taken = true;
      score += 10;
    }
  }
  coins = coins.filter(c => c.x > -30 && !c.taken);
  updateUI();
}

function drawCloud(x,y,s=1) {
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.beginPath();
  ctx.ellipse(x,y,35*s,14*s,0,0,Math.PI*2);
  ctx.ellipse(x+22*s,y-9*s,25*s,20*s,0,0,Math.PI*2);
  ctx.ellipse(x+47*s,y,30*s,14*s,0,0,Math.PI*2);
  ctx.fill();
}

function background() {
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#35aef5");
  sky.addColorStop(.65,"#8ce0ff");
  sky.addColorStop(1,"#e5faff");
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  for (let i=0;i<8;i++) {
    let x = ((i*145 - world*.22)%(W+180)+(W+180))%(W+180)-60;
    let y = 65+(i%4)*78;
    drawCloud(x,y,0.9+(i%2)*0.15);
  }

  ctx.fillStyle = "#81d6a0";
  ctx.beginPath();
  ctx.moveTo(0,H-40);
  for(let x=0;x<=W;x+=30) {
    ctx.lineTo(x,H-50-Math.sin(x*.012+world*.001)*22);
  }
  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.fill();
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x,bird.y);

  if (imageReady) {
    // Use the uploaded bird image as the flying character.
    ctx.drawImage(birdImage,-42,-30,84,60);
  } else {
    // Fallback if the image filename is incorrect or the image is missing.
    ctx.fillStyle="#1675d1";
    ctx.beginPath();
    ctx.ellipse(0,0,25,15,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#0758a8";
    ctx.beginPath();
    ctx.ellipse(-4,-8,15,7,Math.sin(performance.now()/100)*.25,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#ff9d27";
    ctx.beginPath();
    ctx.moveTo(18,-4);ctx.lineTo(34,1);ctx.lineTo(18,5);
    ctx.closePath();ctx.fill();
    ctx.fillStyle="white";
    ctx.beginPath();ctx.arc(11,-7,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#17243a";
    ctx.beginPath();ctx.arc(13,-7,2,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function draw() {
  background();

  // Moving obstacles: collision causes Game Over.
  for (const o of obstacles) {
    const grad = ctx.createLinearGradient(o.x,0,o.x+60,0);
    grad.addColorStop(0,"#c44c19");
    grad.addColorStop(.5,"#ffb52e");
    grad.addColorStop(1,"#c44c19");
    ctx.fillStyle=grad;
    ctx.fillRect(o.x,0,60,o.top);
    ctx.fillRect(o.x,o.top+o.gap,60,H-o.top-o.gap);
    ctx.fillStyle="#ffe08a";
    ctx.fillRect(o.x-5,o.top-8,70,8);
    ctx.fillRect(o.x-5,o.top+o.gap,70,8);
  }

  // Coins float in the cloud area.
  for (const c of coins) {
    ctx.fillStyle="#ffc928";
    ctx.beginPath();ctx.arc(c.x,c.y,11,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#fff5ad";ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle="#9b6200";
    ctx.font="bold 12px Arial";
    ctx.textAlign="center";
    ctx.fillText("+",c.x,c.y+4);
  }

  drawBird();

  if (paused) {
    ctx.fillStyle="rgba(0,20,45,.55)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="white";
    ctx.font="bold 36px Arial";
    ctx.textAlign="center";
    ctx.fillText("PAUSED",W/2,H/2);
  }
}

function frame(now) {
  const dt = Math.min(.04,Math.max(0,(now-lastTime)/1000||0));
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

$("startBtn").addEventListener("click",startGame);
$("playBtn").addEventListener("click",startGame);
$("restartBtn").addEventListener("click",startGame);
$("flyBtn").addEventListener("click",fly);

canvas.addEventListener("pointerdown",() => {
  if (!running && !gameOver) startGame();
});

$("pauseBtn").addEventListener("click",() => {
  if (!running && !paused) return;
  paused = !paused;
  $("pauseBtn").textContent = paused ? "▶ RESUME" : "Ⅱ PAUSE";
});

window.addEventListener("keydown",e => {
  if (["Space","ArrowUp","KeyW"].includes(e.code)) {
    e.preventDefault();
    if (!e.repeat) fly();
  }
  if (e.code === "KeyP" && running) {
    paused = !paused;
    $("pauseBtn").textContent = paused ? "▶ RESUME" : "Ⅱ PAUSE";
  }
});

updateUI();
background();
draw();
lastTime = performance.now();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
